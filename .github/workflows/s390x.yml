name: S390x CI

# Native unit test gate for s390x (big-endian). Catches endianness bugs that
# x86_64-based CI cannot detect. Runs on every PR and master push.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  CI: true
  # mold ships s390x binaries since v2.38; the setup action uses $(uname -m) so
  # it downloads the right tarball automatically. No DISABLE_MOLD needed.
  # Drop debuginfo from the test build: the full default-feature `vector` lib
  # test target with debuginfo=2 peaks high enough to trip the OOM killer
  # (rustc SIGKILL) on the native runner. No debuginfo => far lower peak RAM.
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Cap parallel codegen so concurrent rustc processes can't collectively
  # exhaust RAM. Swap (added below) absorbs remaining single-process peaks.
  CARGO_BUILD_JOBS: "8"

jobs:
  test-s390x:
    name: Unit tests (s390x native)
    runs-on: [self-hosted, Linux, s390x]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure swap headroom (avoid OOM during compile)
        run: |
          # Idempotent on the persistent self-hosted runner: only create the CI
          # swapfile once. Gives the linker/codegen headroom beyond physical RAM.
          SWAPFILE=/swapfile-ci
          if ! sudo swapon --show=NAME --noheadings | grep -qx "$SWAPFILE"; then
            sudo rm -f "$SWAPFILE"
            sudo fallocate -l 24G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=24576
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          free -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsasl2-dev \
            protobuf-compiler

      - uses: ./.github/actions/setup
        with:
          rust: true
          cargo-nextest: true
          protoc: false  # upstream script has no s390x binary; use apt protobuf-compiler above
          vdev: false    # no s390x vdev binary; not needed for testing

      - name: Run unit tests
        run: make test FEATURES="default"
